name: Build Nexa Network AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "nexa-network-ai-v0.1.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q nexa-network-ai-v0.1.zip -d buildsrc
          test -f buildsrc/nexa-network-ai/settings.gradle.kts
          test -f buildsrc/nexa-network-ai/app/build.gradle.kts

      - name: Build debug APK
        working-directory: buildsrc/nexa-network-ai
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: test -f buildsrc/nexa-network-ai/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Network-AI-v0.1-debug
          path: buildsrc/nexa-network-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
